<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Demo widget · access</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: linear-gradient(135deg, #2b4c7e, #567ebb); color: #fff; }
    .card { background: #fff; color: #1d2433; border-radius: 14px; padding: 2rem; max-width: 22rem; margin: 1rem;
            box-shadow: 0 10px 30px rgb(0 0 0 / .25); }
    .logo { font-weight: 700; color: #2b4c7e; letter-spacing: .02em; }
    button { font: inherit; width: 100%; padding: .7rem; border: 0; border-radius: 8px; background: #2b4c7e;
             color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <p class="logo">◆ Demo widget</p>
    <h1>Connect the widget</h1>
    <p>We will show your data in the widget on the partner site. Your browser will then ask for permission once.</p>
    <button type="button" data-framepass-continue data-framepass-popup>Continue</button>
    <p data-framepass-standalone hidden>Done, you can close this tab.</p>
  </div>
</body>
</html>
