<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Сайт-партнёр</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; }
    #slot iframe { width: 100%; height: 260px; border: 1px solid #ccc; border-radius: 8px; }
    code { background: #f2f2f2; padding: 0 .3em; border-radius: 4px; }
    pre { background: #f6f6f6; padding: .8rem; border-radius: 6px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Сайт-партнёр <small><code>__HOST_ORIGIN__</code></small></h1>
  <p>Ниже — виджет с <code>__WIDGET_ORIGIN__</code>. Состояние доступа: <b id="state">unknown</b></p>
  <div id="slot"></div>
  <p><button id="who" type="button">Спросить у виджета: кто я?</button></p>
  <pre id="out">—</pre>

  <script type="module">
    import { mountEmbed } from '/lib/host/index.js';

    const embed = mountEmbed('#slot', { src: '__WIDGET_ORIGIN__/embed', title: 'Демо-виджет' });
    const show = (s) => (document.getElementById('state').textContent = s);
    embed.ready.then(show);
    embed.on('state', show);

    document.getElementById('who').addEventListener('click', async () => {
      const out = document.getElementById('out');
      try {
        out.textContent = JSON.stringify(await embed.call('getSession'), null, 2);
      } catch (e) {
        out.textContent = String(e);
      }
    });
  </script>
</body>
</html>
