<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Partner site</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; }
    #slot iframe { width: 100%; height: 260px; border: 1px solid #ccc; border-radius: 8px; }
    code { background: #f2f2f2; padding: 0 .3em; border-radius: 4px; }
    pre { background: #f6f6f6; padding: .8rem; border-radius: 6px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Partner site <small><code>__HOST_ORIGIN__</code></small></h1>
  <p>Below is the widget from <code>__WIDGET_ORIGIN__</code>. Access state: <b id="state">unknown</b></p>
  <p>First-party visit popup: <a href="/">custom framepass page</a> · <a href="/?visit=login">widget login page</a>
     · <a href="/?mode=button">sign-in button (SSO menu)</a></p>
  <p id="menu" hidden>Portal menu: Home · Catalog · <span id="menu-login"></span> <b id="greeting"></b></p>
  <div id="slot"></div>
  <p><button id="who" type="button">Ask the widget: who am I?</button></p>
  <pre id="out">—</pre>

  <script type="module">
    import { mountEmbed } from '/lib/host/index.js';

    const params = new URLSearchParams(location.search);
    const show = (s) => (document.getElementById('state').textContent = s);

    if (params.get('mode') === 'button') {
      // The widget is only a "Sign in" button in the portal menu (attachLogin).
      document.getElementById('menu').hidden = false;
      document.getElementById('slot').remove();
      document.getElementById('who').parentElement.remove();
      document.getElementById('out').remove();
      const login = mountEmbed('#menu-login', {
        src: '__WIDGET_ORIGIN__/login-button',
        title: 'Sign in',
        attributes: { style: 'border:0;width:130px;height:40px;vertical-align:middle;background:transparent' },
      });
      login.on('state', show);
      login.on('event', async (name) => {
        if (name !== 'signed-in') return;
        // A real portal would fetch a one-time code here and exchange it on its backend.
        const { user } = await login.call('getSession');
        document.getElementById('greeting').textContent = `Hello, ${user}`;
      });
    } else {
      // ?visit=login: the first-party popup is the widget's login page instead of /__framepass/visit
      const visit = params.get('visit') === 'login' ? '?visit=login' : '';
      const embed = mountEmbed('#slot', { src: `__WIDGET_ORIGIN__/embed${visit}`, title: 'Demo widget' });
      embed.ready.then(show);
      embed.on('state', show);

      document.getElementById('who').addEventListener('click', async () => {
        const out = document.getElementById('out');
        try {
          out.textContent = JSON.stringify(await embed.call('getSession'), null, 2);
        } catch (e) {
          out.textContent = String(e);
        }
      });
    }
  </script>
</body>
</html>
