<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Partner site</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; }
    #slot iframe { width: 100%; height: 260px; border: 1px solid #ccc; border-radius: 8px; }
    code { background: #f2f2f2; padding: 0 .3em; border-radius: 4px; }
    pre { background: #f6f6f6; padding: .8rem; border-radius: 6px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Partner site <small><code>__HOST_ORIGIN__</code></small></h1>
  <p>Below is the widget from <code>__WIDGET_ORIGIN__</code>. Access state: <b id="state">unknown</b></p>
  <p>First-party visit popup: <a href="/">custom framepass page</a> · <a href="/?visit=login">widget login page</a></p>
  <div id="slot"></div>
  <p><button id="who" type="button">Ask the widget: who am I?</button></p>
  <pre id="out">—</pre>

  <script type="module">
    import { mountEmbed } from '/lib/host/index.js';

    // ?visit=login: the first-party popup is the widget's login page instead of /__framepass/visit
    const visit = new URLSearchParams(location.search).get('visit') === 'login' ? '?visit=login' : '';
    const embed = mountEmbed('#slot', { src: `__WIDGET_ORIGIN__/embed${visit}`, title: 'Demo widget' });
    const show = (s) => (document.getElementById('state').textContent = s);
    embed.ready.then(show);
    embed.on('state', show);

    document.getElementById('who').addEventListener('click', async () => {
      const out = document.getElementById('out');
      try {
        out.textContent = JSON.stringify(await embed.call('getSession'), null, 2);
      } catch (e) {
        out.textContent = String(e);
      }
    });
  </script>
</body>
</html>
