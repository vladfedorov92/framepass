<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Сайт виджета</title>
  <style>body { font: 16px/1.5 system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; }</style>
</head>
<body>
  <h1>Сайт виджета <small><code>__WIDGET_ORIGIN__</code></small></h1>
  <p>Это «первая сторона» для виджета. Здесь ставится сессионная кука <code>demo_session</code>.</p>
  <p>__USER__</p>
  <form method="post" action="/login">
    <input name="name" placeholder="Имя" required>
    <button>Войти</button>
  </form>
  <p id="back" hidden><button type="button">Вернуться к виджету</button></p>
  <p>Потом откройте <a href="__HOST_ORIGIN__/">сайт-партнёр</a> и проверьте, видит ли виджет сессию.</p>

  <script type="module">
    import { isVisitPopup, notifyVisited } from '/lib/visit/index.js';

    // Opened by the widget as its first-party popup: after login, report the visit and close.
    if (isVisitPopup()) {
      const back = document.getElementById('back');
      back.hidden = false;
      back.querySelector('button').addEventListener('click', () => notifyVisited());
    }
  </script>
</body>
</html>
