<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Demo widget</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 1rem; background: #fbfaf7; }
    button { font: inherit; padding: .4rem 1rem; cursor: pointer; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <p>Widget on <code>__WIDGET_ORIGIN__</code> · state: <b id="state">unknown</b></p>
  <p id="user" class="muted">…</p>
  <button id="allow" type="button" hidden>Allow access</button>
  <p id="hint" class="muted"></p>

  <script type="module">
    import { createEmbed, hasAccess } from '/lib/embed/index.js';

    const hints = {
      'needs-gesture': 'The browser hides our cookies. Press the button and it will ask for permission.',
      'needs-first-party': 'Our site has to be visited once first. The button opens it in a popup.',
      'waiting-host': 'Waiting for the partner site to confirm itself; access is never requested on other sites.',
      'denied': 'Access was not granted. You can try again.',
      'unsupported': 'This browser has no Storage Access API; a fallback is needed (popup + token).',
    };

    async function getSession() {
      const res = await fetch('/api/me', { credentials: 'include', cache: 'no-store' });
      return res.json();
    }

    const loginAsVisit = new URLSearchParams(location.search).get('visit') === 'login';
    const embed = createEmbed({
      allowedHosts: ['__HOST_ORIGIN__'],
      // Way 2: any page of ours can serve as the first-party visit if it calls notifyVisited()
      firstPartyUrl: loginAsVisit ? '/?popup=1' : undefined,
      methods: { getSession: (_params, ctx) => getSession().then((s) => ({ ...s, access: ctx.state })) },
    });

    async function render(state) {
      document.getElementById('state').textContent = state;
      document.getElementById('hint').textContent = hints[state] ?? '';
      const { user } = await getSession();
      document.getElementById('user').innerHTML = user
        ? `Session visible: <b>${user.replace(/[<>&"]/g, '')}</b>`
        : hasAccess(state)
          ? 'Cookies are available, but you are not signed in. <a href="__WIDGET_ORIGIN__/" target="_blank">Sign in on the widget site</a>'
          : 'The session is not visible from the iframe.';
    }

    embed.attach(document.getElementById('allow'));
    embed.on('change', render);
    embed.check().then(render);
  </script>
</body>
</html>
